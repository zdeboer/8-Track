name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  format_and_syntax:
    name: Format check + PHP syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Prettier (check)
        run: npm run format:check

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: PHP lint
        run: |
          find . -name "*.php" -print0 | xargs -0 -n1 php -l
